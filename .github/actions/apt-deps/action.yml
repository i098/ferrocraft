name: apt-deps
description: Install apt packages through the kernel.org mirror if any are missing
inputs:
  packages:
    description: Space-separated apt packages
    required: true
runs:
  using: composite
  steps:
    - shell: bash
      env:
        PACKAGES: ${{ inputs.packages }}
      run: |
        if dpkg -s $PACKAGES >/dev/null 2>&1; then exit 0; fi
        sudo sed -i -e 's|http://azure.archive.ubuntu.com/ubuntu|http://mirrors.edge.kernel.org/ubuntu|g' -e 's|mirror+file:/etc/apt/apt-mirrors.txt|http://mirrors.edge.kernel.org/ubuntu|g' -e 's|mirror://[^ ]*|http://mirrors.edge.kernel.org/ubuntu|g' /etc/apt/sources.list.d/*.sources /etc/apt/sources.list 2>/dev/null || true
        for attempt in 1 2 3; do
          if timeout 300 sudo apt-get -o Acquire::Retries=5 -o Acquire::http::Timeout=30 update &&
             timeout 600 sudo apt-get -o Acquire::Retries=5 -o Acquire::http::Timeout=30 install -y $PACKAGES; then
            exit 0
          fi
          echo "apt attempt $attempt failed; retrying"
          sleep 15
        done
        exit 1
