name: ci
on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "8"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/cache@v4
        with:
          path: target/oracle
          key: oracle-1.8.9-${{ hashFiles('crates/oracle/src/lib.rs', 'java/oracle/**') }}
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  quality-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install sentrux
        run: |
          curl -fsSL -o "$RUNNER_TEMP/sentrux" https://github.com/sentrux/sentrux/releases/download/v0.5.7/sentrux-linux-x86_64
          chmod +x "$RUNNER_TEMP/sentrux"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - run: sentrux plugin add rust
      - run: sentrux gate .
