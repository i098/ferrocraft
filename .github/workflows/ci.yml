name: ci
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ferrocraft
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ferrocraft
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: ./.github/actions/apt-deps
        with:
          packages: libasound2-dev
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ferrocraft
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "8"
      - uses: dtolnay/rust-toolchain@stable
      - uses: ./.github/actions/apt-deps
        with:
          packages: mesa-vulkan-drivers libvulkan1 libasound2-dev
      - uses: actions/cache@v4
        with:
          path: target/oracle
          key: oracle-1.8.9-${{ hashFiles('crates/oracle/src/lib.rs', 'java/oracle/**') }}
      - run: cargo test --workspace

  quality-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
      - name: Install sentrux
        run: |
          curl -fsSL -o "$RUNNER_TEMP/sentrux" https://github.com/sentrux/sentrux/releases/download/v0.5.7/sentrux-linux-x86_64
          chmod +x "$RUNNER_TEMP/sentrux"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - run: sentrux gate .
