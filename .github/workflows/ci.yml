name: ci
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ferrocraft
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "8"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Install software Vulkan driver (lavapipe) for the render test
        run: |
          if dpkg -s mesa-vulkan-drivers libvulkan1 libasound2-dev >/dev/null 2>&1; then exit 0; fi
          sudo sed -i -e 's|http://azure.archive.ubuntu.com/ubuntu|http://mirrors.edge.kernel.org/ubuntu|g' -e 's|mirror+file:/etc/apt/apt-mirrors.txt|http://mirrors.edge.kernel.org/ubuntu|g' -e 's|mirror://[^ ]*|http://mirrors.edge.kernel.org/ubuntu|g' /etc/apt/sources.list.d/*.sources /etc/apt/sources.list 2>/dev/null || true
          for attempt in 1 2 3; do
            if timeout 300 sudo apt-get -o Acquire::Retries=5 -o Acquire::http::Timeout=30 update &&
               timeout 600 sudo apt-get -o Acquire::Retries=5 -o Acquire::http::Timeout=30 install -y mesa-vulkan-drivers libvulkan1 libasound2-dev; then
              exit 0
            fi
            echo "apt attempt $attempt failed; retrying"
            sleep 15
          done
          exit 1
      - uses: actions/cache@v4
        with:
          path: target/oracle
          key: oracle-1.8.9-${{ hashFiles('crates/oracle/src/lib.rs', 'java/oracle/**') }}
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  quality-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install sentrux
        run: |
          curl -fsSL -o "$RUNNER_TEMP/sentrux" https://github.com/sentrux/sentrux/releases/download/v0.5.7/sentrux-linux-x86_64
          chmod +x "$RUNNER_TEMP/sentrux"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - run: sentrux gate .
