name: release
on:
  push:
    tags: ["v*"]

env:
  CARGO_TERM_COLOR: always
  FABRIC_LOADER_URL: https://maven.fabricmc.net/net/fabricmc/fabric-loader/0.16.10/fabric-loader-0.16.10.jar

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-15, target: aarch64-apple-darwin }
          - { os: macos-15-intel, target: x86_64-apple-darwin }
          - { os: ubuntu-22.04, target: x86_64-unknown-linux-gnu }
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "8"
      - name: Build jars
        run: |
          mkdir stage
          java/launcher/build.sh stage/ferrocraft-boot.jar
          curl -fsSL -o fabric-loader.jar "$FABRIC_LOADER_URL"
          [ "$(openssl dgst -sha256 -r fabric-loader.jar | cut -d' ' -f1)" = "23557a7d6da3db971a6f9620cb62e7b6e6d1509f5138ebb87529877d2400e568" ]
          FABRIC_LOADER_JAR=$PWD/fabric-loader.jar loaders/fabric/build.sh stage/ferrocraft-fabric.jar
          export FERRO_JAVA_HOME="$JAVA_HOME" FERRO_LIB="$PWD/host-libs"
          mkdir "$FERRO_LIB"
          fetch() {
            curl -fsSL "$1" -o "$FERRO_LIB/$2"
            [ "$(openssl dgst -sha256 -r "$FERRO_LIB/$2" | cut -d' ' -f1)" = "$3" ]
          }
          fetch https://libraries.minecraft.net/net/minecraft/launchwrapper/1.12/launchwrapper-1.12.jar lw.jar 57f402b626d16cc2705bf2a37add7adbb074f0ca3b3102fa6e23aa303dae682f
          fetch https://repo.maven.apache.org/maven2/org/ow2/asm/asm-all/5.2/asm-all-5.2.jar asm-all-5.2.jar 7fbffbc1db3422e2101689fd88df8384b15817b52b9b2b267b9f6d2511dc198d
          fetch https://maven.minecraftforge.net/net/minecraftforge/forge/1.8.9-11.15.1.2318-1.8.9/forge-1.8.9-11.15.1.2318-1.8.9-universal.jar forge.jar 596512ad5f12f95d8a3170321543d4455d23b8fe649c68580c5f828fe74f6668
          fetch https://repo.maven.apache.org/maven2/com/google/guava/guava/17.0/guava-17.0.jar guava-17.0.jar 8c36a80ea613d0b6b8040a17cf837c5bbe3677bc1b06a058a6c174fdb787ebbc
          java/modhost/build.sh
          cp java/modhost/ferro-host.jar stage/
          FABRIC_LOADER_JAR="$PWD/fabric-loader.jar" java/modhost-fabric/build.sh
          cp target/modhost-fabric/ferro-host-fabric.jar stage/
          java/modhost-prepare/run.sh names stage
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install Linux build libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libudev-dev libxkbcommon-dev libwayland-dev
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --target ${{ matrix.target }} -p ferrocraft-engine -p ferrocraft-launcher
      - name: Package
        run: |
          ext=""; [ "$RUNNER_OS" = Windows ] && ext=.exe
          bin=target/${{ matrix.target }}/release
          cp "$bin/ferrocraft-engine$ext" "$bin/ferrocraft-launcher$ext" stage/
          cp THIRD_PARTY.md stage/
          tar -czf "ferrocraft-${{ matrix.target }}.tar.gz" -C stage .
      - uses: actions/upload-artifact@v4
        with:
          name: archive-${{ matrix.target }}
          path: ferrocraft-${{ matrix.target }}.tar.gz

  publish:
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: archive-*
          path: assets
          merge-multiple: true
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" assets/*.tar.gz install.sh install.ps1 --generate-notes
