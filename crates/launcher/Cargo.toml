[package]
name = "ferrocraft-launcher"
version = "0.1.0"
edition = "2021"
publish = false

[[bin]]
name = "ferrocraft-launcher"
path = "src/main.rs"

[dependencies]
ferrocraft-oneclient = { path = "../oneclient" }
rusqlite = { version = "0.37", features = ["bundled"] }
serde_json = "1"
sha2 = "0.11"
tempfile = "3"

[target.'cfg(windows)'.dependencies]
dirs = "6"
windows-registry = "0.6"
