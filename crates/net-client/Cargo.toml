[package]
name = "ferrocraft-net-client"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Minecraft 1.8.9 client session: offline login, play-state reader thread and typed events"

[dependencies]
ferrocraft-protocol = { path = "../protocol" }
world = { path = "../world" }
serde_json = "1"
sha1 = "0.10"
rsa = "0.9"
rand_core = { version = "0.6", features = ["getrandom"] }
ureq = "3"
hickory-resolver = { version = "0.24", default-features = false, features = ["system-config", "tokio-runtime"] }
