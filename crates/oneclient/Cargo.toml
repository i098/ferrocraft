[package]
name = "ferrocraft-oneclient"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Reads a OneClient cluster and fetches the Forge 1.8.9 build of each of its mods from Modrinth"

[dependencies]
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
serde_json = "1"
sha1 = "0.10"
tempfile = "3"
ureq = "3"
zip = { version = "2", default-features = false, features = ["deflate-flate2", "flate2"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Security", "Win32_Storage_FileSystem", "Win32_System_Threading"] }
