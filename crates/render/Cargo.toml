[package]
name = "render"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "wgpu renderer for the ferrocraft 1.8.9 client: chunk meshes, sky, crosshair, chat and debug text"

[dependencies]
bytemuck = { version = "1", features = ["derive"] }
# Vanilla post shaders are GLSL 1.20 from the jar; naga parses them after `glsl.rs` rewrites them.
naga = { version = "24", features = ["glsl-in"] }
pollster = "0.4"
png = "0.17"
serde_json = "1"
wgpu = { version = "24", features = ["naga-ir"] }
winit = "0.30"
world = { path = "../world" }
zip = { version = "2", default-features = false, features = ["deflate"] }
