[package]
name = "render"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "wgpu renderer for the ferrocraft 1.8.9 client: chunk meshes, sky, crosshair, chat and debug text"

[dependencies]
bytemuck = { version = "1", features = ["derive"] }
pollster = "0.4"
png = "0.17"
wgpu = "24"
winit = "0.30"
zip = { version = "2", default-features = false, features = ["deflate"] }
